apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hashimoto-platform-namespaces
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/EdwinRodriguezValle/hashimoto-manifests.git'
    targetRevision: main
    path: namespaces
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      # Removing a Namespace can delete all of its namespaced resources.
      # Keep namespace retirement explicit and reviewed.
      prune: false
      selfHeal: true
