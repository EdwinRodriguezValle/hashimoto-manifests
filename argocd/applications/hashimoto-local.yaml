apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hashimoto-platform-namespaces
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/EdwinRodriguezValle/hashimoto-manifests.git'
    targetRevision: feature/argocd-manifests
    path: . # La raíz contiene kustomization.yaml y namespaces.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
