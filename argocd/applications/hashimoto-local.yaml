apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hashimoto-platform-namespaces
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com'
    targetRevision: HEAD
    path: platform/namespaces # 👈 Argo CD leerá esta carpeta primero
  destination:
    server: 'https://default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
