apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hashimoto-api-gateway
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/EdwinRodriguezValle/hashimoto-platform.git # 👈 Tu URL de manifiestos
    targetRevision: main
    path: k8s # 👈 La ruta de Kustomize que creamos antes
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: hashimoto-core # 👈 Se desplegará dentro del namespace core
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
