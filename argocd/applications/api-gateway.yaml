apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hashimoto-api-gateway
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/EdwinRodriguezValle/hashimoto-platform.git # 👈 Tu URL de manifiestos
    targetRevision: main
    path: k8s # 👈 La ruta de Kustomize que creamos antes
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: hashimoto-core # 👈 Se desplegará dentro del namespace core
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # The namespaces child Application owns namespace creation. Retry here so
    # the platform can sync cleanly even if both child Applications start together.
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
